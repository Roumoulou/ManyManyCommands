# Mémoire allouée à Gradle
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# L'entrepôt C:\MC-Kit, le même sur chaque poste : ses deux racines se déclarent ici, en
# barres obliques, et machine.properties peut les surcharger par poste. Ce qui est propre au
# poste (les instances PrismLauncher) ou à la personne (le joueur des runs client,
# outfitter.username, outfitter.login) n'est PAS ici : il vit dans machine.properties, qui
# n'est jamais versionné. Un clone n'hérite ainsi ni des instances ni du pseudo de l'auteur.
# Voir le README.
outfitter.profiles_dir=C:/MC-Kit/00-favorites
outfitter.maps_dir=C:/MC-Kit/01-maps

# D'où vient Outfitter, le plugin des environnements de développement : composite (les
# sources fraîches de S:\16\_V\Outfitter, le défaut) ou repsy (l'artefact publié sur
# Repsy, à la version du catalogue libs ; celui d'un clone qui n'a pas le voisin). Se
# surcharge à la commande : -Poutfitter_source=repsy. Voir settings.gradle.kts.
outfitter_source=composite

# Mod Properties
# mod_id est l'identifiant Fabric, déclaré UNE seule fois pour le build : processResources
# l'injecte dans fabric.mod.json, le build s'en sert (bloc mods de Loom, groupe de tâches,
# publication) et Outfitter aussi (nom du jar déployé, logger de levels.xml). Le code porte
# le même dans sa constante MOD_ID, que l'étage 1 des tests confronte à celui-ci.
mod_id=manymanycommands
mod_version=0.1.0
maven_group=fr.roumoulou
archives_base_name=manymanycommands

# La publication sur Modrinth et CurseForge (section 10 du plugin de version) : les deux
# projets, par leurs identifiants, publics et stables. Celui de Modrinth est l'identifiant
# à huit caractères de la page du projet, pas son adresse. Vides tant que les projets
# n'existent pas : l'envoi réel refuse.
# Les jetons ne vivent jamais ici : MODRINTH_TOKEN et CURSEFORGE_TOKEN, posés par
# dev-secrets.ps1 dans le terminal qui publie. Un envoi réel se demande à la commande,
# -Ppublish_live=true ; sans lui, publishMods est un essai à blanc.
modrinth_project_id=ODBL7dkE
curseforge_project_id=1744797

# Le canal de la version sur les deux plateformes : alpha, beta ou stable. Une version
# publiée ne se republie jamais ; le canal dit seulement comment la prendre.
publish_type=beta

# Les maps de l'entrepôt copiées dans les saves des clients de dev : noms exacts,
# séparés par des virgules, catégorie jamais mentionnée. Clé absente ou vide :
# toutes les maps de l'entrepôt. machine.properties peut la surcharger par poste.
# Le monde du serveur ne dépend pas d'elle (voir outfitter.server_world), et retirer
# une map d'ici n'efface pas sa copie déjà dans un environnement.
outfitter.maps=World_Flat_MushroomFields

# Le monde de départ du serveur de dev (runServer), copié sous `world` : un nom exact de
# l'entrepôt de maps. Vide, c'est la clé "world" du profile.json du profil `dev` de
# l'entrepôt qui décide, sinon la première map par ordre alphabétique. Un nom introuvable
# est signalé et retombe au cran suivant. machine.properties peut surcharger.
outfitter.server_world=

# Les logs des runs, trois clés indépendantes (les montages log4j sont des ressources
# d'Outfitter, extraits dans build\outfitter\log4j\ avant chaque run).
# outfitter.log_level règle la console de TOUT LE MONDE (trace, debug, info, warn, error ;
# vide = info, le défaut Fabric) ; outfitter.mod_log_level ne règle que le logger du mod,
# pour voir son debug ou son trace sans le bruit des autres. machine.properties peut
# surcharger par poste, -P dépanne ponctuellement, et logs/debug.log reçoit toujours
# tout, quels que soient ces réglages.
outfitter.log_level=info
outfitter.mod_log_level=trace

# Le FORMAT de la console : vide = l'habillage de Loom ; `compact` (une ligne, emoji
# par niveau, héritier du soft-compact d'Enhanced Terminal Logging) ou `details`
# (deux lignes avec Classe::Méthode(Ligne) et PID, le diagnostic poussé, plus lent).
outfitter.log_format=compact
